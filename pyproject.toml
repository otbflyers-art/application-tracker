[project]
name = "ib-tracker"
version = "0.1.0"
description = "Track investment-banking full-time analyst openings across bank career sites and keep an Excel tracker up to date."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
]

[project.scripts]
ib-tracker = "ib_tracker.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.24",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
